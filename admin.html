<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin – termini</title>
  <meta name="theme-color" content="#0b0b0c">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest-admin.json">
  <link rel="icon" href="icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="top">
    <span class="logo"><img class="logo-img" src="icon-192.png" alt=""><span id="naziv"></span></span>
    <nav><a href="#" id="odjava" hidden>Odjava</a></nav>
  </header>

  <main>
    <section id="prijava" class="narudzba" style="margin-top:50px">
      <h2>Prijava za salon</h2>
      <form id="prijavaForma">
        <label>Email
          <input type="email" id="email" required autocomplete="username">
        </label>
        <label>Lozinka
          <input type="password" id="lozinka" required autocomplete="current-password">
        </label>
        <button class="btn" type="submit">Prijavi se</button>
        <p id="greska" role="alert"></p>
      </form>
    </section>

    <section id="panel" hidden style="padding-top:40px">
      <h1 style="margin-bottom:20px">Termini</h1>
      <div id="kalendar"></div>
      <div class="dan-naslov"><h2 id="danNaslov"></h2><span class="prazno" id="danBroj"></span></div>
      <div id="lista"></div>
    </section>

    <!-- Povijest jednog klijenta (otvara se klikom na termin) -->
    <dialog id="povijest" class="prozor">
      <div class="prozor-glava">
        <div><h2 id="pIme"></h2><a id="pTel"></a></div>
        <button class="kal-strelica" type="button" id="pZatvori" aria-label="Zatvori">×</button>
      </div>
      <div class="cipovi" id="pSazetak"></div>
      <div id="pLista"></div>
    </dialog>
  </main>

  <script type="module">
    import { Store, Auth, cijena } from './app.js';
    import { SALON } from './postavke.js';
    import { kalendar, ymd } from './kalendar.js';
    const $ = id => document.getElementById(id);
    const lista = $('lista'), greska = $('greska'), odjava = $('odjava');
    const mjeseci = {}; // 'YYYY-MM' -> termini tog mjeseca (učitava se samo mjesec koji se gleda)
    const dan = d => (mjeseci[d.slice(0, 7)] || []).filter(t => t.datum === d);
    const lijepDan = (d, o = { weekday: 'long', day: 'numeric', month: 'long' }) => new Date(d + 'T00:00').toLocaleDateString('hr-HR', o);
    const kratkiDan = d => lijepDan(d, { day: 'numeric', month: 'numeric', year: 'numeric' });
    const sad = () => ymd(new Date()) + 'T' + new Date().toTimeString().slice(0, 5);
    $('naziv').textContent = SALON.naziv;
    document.title = SALON.naziv + ' – termini';
    const el = (tag, cls, tekst) => { const e = document.createElement(tag); if (cls) e.className = cls; if (tekst != null) e.textContent = tekst; return e; };

    $('prijavaForma').addEventListener('submit', async (e) => {
      e.preventDefault();
      greska.textContent = '';
      try { await Auth.login($('email').value, $('lozinka').value); }
      catch { greska.textContent = 'Pogrešan email ili lozinka.'; }
    });
    odjava.addEventListener('click', (e) => { e.preventDefault(); Auth.logout(); });

    // Kalendar: značka na danu = broj termina tog dana; klik na dan prikaže njegove termine
    const kal = kalendar($('kalendar'), {
      loc: () => 'hr-HR',
      oznaka: d => dan(d).length || '',
      odabir: prikaziDan,
      naMjesec: ym => ucitajMjesec(ym)
    });

    Auth.onChange(user => {
      // Admin je samo vlasnik salona (email iz postavke.js; baza to isto provjerava u firestore.rules)
      if (user && (user.email || '').toLowerCase() !== SALON.emailVlasnika.toLowerCase()) {
        greska.textContent = 'Ovaj račun nema pristup. Prijavi se emailom vlasnika salona.';
        Auth.logout(); return;
      }
      $('prijava').hidden = !!user;
      $('panel').hidden = !user;
      odjava.hidden = !user;
      if (user) { kal.postavi(kal.odabrani() || ymd(new Date())); osvjezi(); }
    });
    // Kad se aplikacija ponovno otvori, povuci nove termine
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && Auth.user()) osvjezi();
    });
    function osvjezi() {
      const odabrani = kal.odabrani().slice(0, 7);
      if (odabrani !== kal.mjesec()) ucitajMjesec(odabrani);
      ucitajMjesec(kal.mjesec());
    }

    async function ucitajMjesec(ym) {
      const [g, m] = ym.split('-').map(Number);
      try { mjeseci[ym] = await Store.razdoblje(ym + '-01', ymd(new Date(g, m, 0))); }
      catch { mjeseci[ym] = null; }
      kal.crtaj();
      if (kal.odabrani().startsWith(ym)) prikaziDan(kal.odabrani());
    }

    function prikaziDan(d) {
      lista.innerHTML = '';
      $('danNaslov').textContent = lijepDan(d);
      $('danBroj').textContent = '';
      if (mjeseci[d.slice(0, 7)] === undefined) return; // još se učitava
      if (mjeseci[d.slice(0, 7)] === null) { lista.append(el('p', 'prazno', 'Nemaš dozvolu ili je došlo do greške.')); return; }
      const termini = dan(d).sort((a, b) => a.vrijeme.localeCompare(b.vrijeme));
      $('danBroj').textContent = termini.length ? `${termini.length} ${termini.length === 1 ? 'termin' : 'termina'}` : '';
      if (!termini.length) { lista.append(el('p', 'prazno', 'Nema termina za taj dan.')); return; }
      termini.forEach(t => lista.append(kartica(t, () => ucitajMjesec(d.slice(0, 7)))));
    }

    // Povijest klijenata (pamti se dok je aplikacija otvorena, da se ne čita stalno iz baze)
    const povijesti = {};
    async function povijestKlijenta(uid, svjeze = false) {
      if (svjeze || !povijesti[uid]) {
        try { povijesti[uid] = await Store.mine(uid); } catch { return null; }
      }
      return povijesti[uid];
    }
    const prosao = t => t.datum + 'T' + t.vrijeme < sad();
    function statistika(svi) {
      const nije = svi.filter(x => x.nijeDosao && !x.otkazanKasno).length;
      const kasno = svi.filter(x => x.nijeDosao && x.otkazanKasno).length;
      const dosao = svi.filter(x => prosao(x) && !x.nijeDosao && !x.otkazanKasno).length;
      const buducih = svi.filter(x => !prosao(x) && !x.otkazanKasno).length;
      const dug = svi.filter(x => x.nijeDosao && !x.podmireno).reduce((z, x) => z + cijena(x.usluga), 0);
      return { ukupno: svi.length, nije, kasno, dosao, buducih, dug };
    }

    // Jedan termin: klik na tekst otvara povijest klijenta; gumbi ovise o tome je li termin prošao
    function kartica(t, nakon, uPovijesti = false) {
      const k = el('div', 'termin' + (t.nijeDosao ? ' propusten' : ''));
      k.dataset.uid = t.uid || '';
      const info = el('div', 'info');
      info.append(el('strong', null, uPovijesti ? `${kratkiDan(t.datum)} u ${t.vrijeme}` : `${t.vrijeme} – ${t.ime}`), el('br'));
      if (uPovijesti) info.append(t.usluga);
      else { const tel = el('a', null, t.tel); tel.href = 'tel:' + t.tel; info.append(`${t.usluga} · `, tel); }
      if (t.napomena) info.append(el('br'), 'Napomena: ' + t.napomena);
      if (t.nijeDosao) info.append(el('span', 'znacka-nije', `${t.otkazanKasno ? 'Kasno otkazano' : 'Nije došao/la'} · ${t.podmireno ? 'plaćeno' : 'nije plaćeno ' + cijena(t.usluga) + ' €'}`));
      else if (t.otkazanKasno) info.append(el('span', 'prazno', 'Kasno otkazano · oprošteno'));
      if (!uPovijesti && t.uid) { info.classList.add('klik'); info.title = 'Prikaži sve termine klijenta'; info.onclick = e => { if (!e.target.closest('a')) povijest(t); }; }
      k.append(info);

      const gumbi = el('div', 'gumbi-termin');
      const gumb = (tekst, fn, klasa = '') => { const b = el('button', 'btn-otkazi ' + klasa, tekst); b.onclick = () => fn(b); gumbi.append(b); };
      // Spremanje oznake: gumbi se zaključaju dok traje, a greška se uvijek prikaže
      const spremi = async (b, posao, pitanje) => {
        if (pitanje && !confirm(pitanje)) return;
        gumbi.querySelectorAll('button').forEach(x => { x.disabled = true; });
        b.textContent = 'Spremam…';
        try { await posao(); if (t.uid) delete povijesti[t.uid]; nakon(); }
        catch (e) {
          alert('Spremanje nije uspjelo.\n\nNajčešći razlog: u Firebaseu nisu zalijepljena nova pravila (Firestore Database → Rules).\n\nGreška: ' + (e.code || e.message));
          nakon();
        }
      };
      const oznaci = polja => () => Store.oznaci(t.id, polja);
      if (t.otkazanKasno) {
        if (t.nijeDosao && !t.podmireno) {
          gumb('Plaćeno', b => spremi(b, oznaci({ podmireno: true }), `${t.ime}: kasno otkazani termin je plaćen (${cijena(t.usluga)} €)?`));
          gumb('Oprosti', b => spremi(b, oznaci({ nijeDosao: false, podmireno: false }), `Oprostiti ${t.ime} kasni otkaz?`), 'sivo');
        }
      } else if (!prosao(t)) {
        if (!uPovijesti) gumb('Otkaži termin', b => spremi(b, () => Store.remove(t), `Otkazati termin: ${t.ime}, ${t.vrijeme}?`));
      } else if (!t.nijeDosao) {
        gumb('Nije došao/la', b => spremi(b, oznaci({ nijeDosao: true, podmireno: false }), `Označiti da ${t.ime} nije došao/la (${kratkiDan(t.datum)} u ${t.vrijeme})?\n\nKod sljedećeg dolaska plaća i ovaj termin (${cijena(t.usluga)} €).`), 'opasno');
      } else {
        if (!t.podmireno) gumb('Plaćeno', b => spremi(b, oznaci({ podmireno: true }), `${t.ime}: propušteni termin je plaćen (${cijena(t.usluga)} €)?`));
        gumb('Ipak je došao/la', b => spremi(b, oznaci({ nijeDosao: false, podmireno: false })), 'sivo');
      }
      if (gumbi.children.length) k.append(gumbi);
      return k;
    }

    // Povijest klijenta: svi njegovi termini, najnoviji prvi
    async function povijest(t, svjeze = false) {
      $('pIme').textContent = t.ime;
      $('pTel').textContent = t.tel; $('pTel').href = 'tel:' + t.tel;
      $('pSazetak').innerHTML = '';
      $('pSazetak').append(el('span', 'prazno', 'Učitavam…'));
      $('pLista').innerHTML = '';
      if (!$('povijest').open) $('povijest').showModal();
      const p = await povijestKlijenta(t.uid, svjeze);
      $('pSazetak').innerHTML = '';
      if (!p) { $('pSazetak').append(el('span', 'prazno', 'Ne mogu učitati povijest.')); return; }
      const s = statistika(p);
      const cip = (tekst, klasa = '') => $('pSazetak').append(el('span', 'cip ' + klasa, tekst));
      cip(`Dolazaka ${s.dosao}`);
      cip(`Nedolazaka ${s.nije}`, s.nije ? 'losa' : '');
      if (s.kasno) cip(`Kasnih otkaza ${s.kasno}`, 'losa');
      cip(`Budućih ${s.buducih}`);
      if (s.dug) cip(`Duguje ${s.dug} €`, 'losa');
      p.slice().sort((a, b) => (b.datum + b.vrijeme).localeCompare(a.datum + a.vrijeme))
        .forEach(x => $('pLista').append(kartica(x, () => { povijest(t, true); ucitajMjesec(kal.mjesec()); }, true)));
    }
    $('pZatvori').onclick = () => $('povijest').close();
    $('povijest').addEventListener('click', e => { if (e.target === $('povijest')) $('povijest').close(); });
  </script>
</body>
</html>
